services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-lapakwu}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD di .env.production}
      POSTGRES_DB: ${PG_DATABASE:-lapakwu}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 60s

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://lapakwu.bluepack.my.id}
        NEXT_PUBLIC_QRIS_URL: ${NEXT_PUBLIC_QRIS_URL:-/qris.jpg}
        NEXT_PUBLIC_KONTAK_WA: ${NEXT_PUBLIC_KONTAK_WA:-}
        NEXT_PUBLIC_KONTAK_EMAIL: ${NEXT_PUBLIC_KONTAK_EMAIL:-}
    restart: unless-stopped
    env_file:
      - .env.production
      - .env.production.secrets
    environment:
      NODE_ENV: production
      POSTGRES_URL: postgresql://${PG_USER:-lapakwu}:${PG_PASSWORD}@db:5432/${PG_DATABASE:-lapakwu}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET di .env.production}
      OCR_PYTHON: /opt/paddle/bin/python
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://lapakwu.bluepack.my.id}
    ports:
      - "127.0.0.1:${LAPAKWU_PORT:-3101}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - ocr-models:/home/node/.paddlex
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  internal:
volumes:
  postgres-data:
  ocr-models:
